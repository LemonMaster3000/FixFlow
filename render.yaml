services:
  - type: web
    name: fixflow-workspace
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fixflow-db
          property: connectionString

databases:
  - name: fixflow-db
    plan: free
